# Creates or updates the repository's labels from .github/labels.yml.
# Labels not in the file are left alone; nothing is deleted.
name: Labels

on:
  push:
    branches: [main]
    paths: [".github/labels.yml", ".github/workflows/labels.yml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet pyyaml

      - name: Sync labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json, subprocess, yaml

          def gh(*args, check=True):
              return subprocess.run(["gh", *args], check=check, capture_output=True, text=True)

          existing = {l["name"].casefold(): l["name"] for l in
                      json.loads(gh("label", "list", "--limit", "500", "--json", "name").stdout)}
          for item in yaml.safe_load(open(".github/labels.yml")):
              name, color, desc = item["name"], item["color"], item.get("description", "")
              old = next((existing[a.casefold()] for a in item.get("aliases", []) if a.casefold() in existing), None)
              if name.casefold() in existing:
                  gh("label", "edit", existing[name.casefold()], "--name", name, "--color", color, "--description", desc)
                  print("updated", name)
              elif old:
                  gh("label", "edit", old, "--name", name, "--color", color, "--description", desc)
                  existing[name.casefold()] = name
                  print("renamed", old, "->", name)
              else:
                  gh("label", "create", name, "--color", color, "--description", desc)
                  existing[name.casefold()] = name
                  print("created", name)
