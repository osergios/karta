# Publishes a release, either when a version tag (e.g. v1.0.0) is pushed, or from
# Actions → Release → Run workflow (the tag is then created on the chosen branch):
#   1. creates the GitHub Release, with notes from docs/releases/<tag>.md when that file exists;
#   2. builds the Docker image for amd64 and arm64 and pushes it to ghcr.io/<owner>/karta.
# Both jobs live in one workflow because a release created with GITHUB_TOKEN does not trigger
# other workflows.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v1.0.0 (created on this branch if it doesn't exist)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub Release (and the tag, if needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$TAG'"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 0
          fi
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Karta $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Karta $TAG" --generate-notes
          fi

  docker-image:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/karta
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Karta
            org.opencontainers.image.description=Ψηφιακή κάρτα εργασίας για το ΕΡΓΑΝΗ · Digital work card for Ergani
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: KARTA_VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
