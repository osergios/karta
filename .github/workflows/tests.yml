# Runs the test suite on every pull request (including Dependabot's) and every push to main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"     # the version in the Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest

      - name: Check setup.sh
        run: bash -n setup.sh

      - name: Check the Docker image builds
        run: docker build -t karta-test .

      - name: Check the image starts with a fresh volume
        run: |
          docker run -d --name karta-test -p 127.0.0.1:8000:8000 -v karta-test-data:/data \
            -e ERGANI_MODE=dry_run -e EMPLOYER_AFM=123456789 -e CF_ACCESS_TEAM_DOMAIN=test.cloudflareaccess.com \
            -e CF_ACCESS_AUD=test -e ADMIN_EMAILS=admin@example.com -e PUBLIC_ORIGIN=http://127.0.0.1:8000 \
            karta-test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs karta-test
          exit 1

      - name: Check the setup assistant runs inside the image
        run: |
          out=$(docker run --rm -e PYTHONPATH=/srv:/srv/vendor -w /tmp karta-test python -m app.setup check 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Δεν βρέθηκε το .env"     # it started and looked for .env (no crash)
