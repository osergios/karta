# Runs the test suite on every pull request (including Dependabot's) and every push to main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"     # the version in the Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest

      - name: Check the Docker image builds
        run: docker build -t karta-test .
