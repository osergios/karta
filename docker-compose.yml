# Karta + Cloudflare Tunnel: the simplest way to run Karta on a Raspberry Pi, an old PC or a small
# server. The tunnel gives you HTTPS on your own domain without opening any port on your router.
#
#   1. Put this file and your .env in the same folder (see docs/wiki/Easy-Installation.md).
#   2. In .env set TUNNEL_TOKEN (from Cloudflare Zero Trust → Networks → Tunnels) and COMPOSE_PROFILES=tunnel
#      (./setup.sh writes both).
#   3. docker compose up -d
#
# In the tunnel's "Public hostname" settings, point your hostname to:  http://karta:8000
# Your own reverse proxy instead of the tunnel: leave COMPOSE_PROFILES out and see the wiki page
# "Behind your own reverse proxy" (docs/wiki/Reverse-Proxy.md).
services:
  karta:
    # the version is set in .env (KARTA_VERSION=1.5.0); ./setup.sh writes it, «Ενημέρωση τώρα» changes it
    image: ghcr.io/osergios/karta:${KARTA_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - karta-data:/data
    # No "ports": Karta is reached only through the tunnel, never directly from the internet.
    # Hardening: only /data (the database, backups' cache) and /tmp are writable, no extra privileges.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m              # Karta uses ~75 MB; 512 MB leaves room on small machines
    pids_limit: 128
    environment:
      TZ: Europe/Athens          # log timestamps only; the app always uses Europe/Athens
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]         # started only with COMPOSE_PROFILES=tunnel in .env
    restart: unless-stopped
    # http2 for a machine at the shop or at home (home routers handle QUIC/UDP badly), auto on a VPS
    command: tunnel --no-autoupdate --protocol ${TUNNEL_PROTOCOL:-http2} run
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      # without it cloudflared stops with an error in its log («docker compose logs cloudflared»). Not «:?»: Compose
      # would refuse to start Karta alone too, even when this service's profile is off.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - karta

volumes:
  karta-data:
